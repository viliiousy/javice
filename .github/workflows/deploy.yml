name: Deploy to Vercel

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # 배포가 밀렸을 때 손으로 다시 올릴 수 있게

# 이 워크플로는 자기를 부른 커밋을 체크아웃해서 그대로 배포한다.
# 그래서 run 이 순서를 뒤바꿔 돌면 옛 커밋이 나중에 올라가 새 변경을 덮어쓴다.
# 실제로 2026-08-26 GitHub Actions 장애 때 그렇게 됐다 — 커밋 7개를 밀어 넣었는데
# 마지막으로 끝난 배포가 두 번째 커밋이라 나머지 다섯이 사이트에서 사라져 있었다.
# 같은 그룹에 묶어 두면 늘 가장 마지막 push 만 살아남는다.
concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject version
        run: |
          VERSION=$(TZ='Asia/Seoul' date +'v%y.%m.%d.%H%M')
          echo "Version: $VERSION"
          # index.html 버전 교체
          sed -i "s/v[0-9]\{2\}\.[0-9]\{2\}\.[0-9]\{2\}\.[0-9]\{4\} 업데이트/$VERSION 업데이트/g" index.html
          echo "Version injected: $VERSION"

      - name: Deploy to Vercel
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes

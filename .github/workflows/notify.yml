name: Send Notifications

on:
  schedule:
    # 10분마다. 매시 정각만 돌던 시절엔 :00~:04 로 맞춘 알림만 나갔고
    # 21:30 같은 설정은 영영 오지 않았다.
    #
    # 다만 지금 정확성은 이 주기에 걸려 있지 않다. api/cron-notify.js 는
    # '지금이 그 시각인가' 가 아니라 '지났는가 + 오늘 보냈는가' 로 판정한다.
    # 그래서 이 주기가 정하는 건 '얼마나 늦게 올 수 있나' 뿐이다 — 최대 10분.
    # GitHub 의 예약 실행이 밀려도, 한 번 걸러도, 다음 실행이 대신 보낸다.
    - cron: '*/10 * * * *'
  workflow_dispatch:  # 수동 실행 가능
    inputs:
      force:
        description: '설정 시각을 무시하고 지금 즉시 발송 (테스트용)'
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger notification cron
        run: |
          # bashy.app 을 직접 호출한다.
          # javice.vercel.app 은 308 리다이렉트라 curl 이 따라가지 않고,
          # -L 을 붙여도 호스트가 바뀌면 Authorization 헤더가 빠진다.
          # 그래서 크론이 아무 일도 안 한 채 초록불로 끝나 버렸다.
          # force=1 은 수동 실행에서만 붙는다. 예약 실행에서는 inputs 가 비어 있어 그냥 ''.
          code=$(curl -sS -o /tmp/cron.json -w '%{http_code}' \
            "https://bashy.app/api/cron-notify${{ inputs.force && '?force=1' || '' }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          cat /tmp/cron.json; echo
          # 실패를 초록불로 넘기지 않는다
          [ "$code" = "200" ] || exit 1

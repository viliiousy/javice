name: Send Notifications

on:
  schedule:
    # 매시간 정각 실행 (UTC 기준 - 한국은 +9시간)
    - cron: '0 * * * *'
  workflow_dispatch:  # 수동 실행 가능
    inputs:
      force:
        description: '설정 시각을 무시하고 지금 즉시 발송 (테스트용)'
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger notification cron
        run: |
          # bashy.app 을 직접 호출한다.
          # javice.vercel.app 은 308 리다이렉트라 curl 이 따라가지 않고,
          # -L 을 붙여도 호스트가 바뀌면 Authorization 헤더가 빠진다.
          # 그래서 크론이 아무 일도 안 한 채 초록불로 끝나 버렸다.
          # force=1 은 수동 실행에서만 붙는다. 예약 실행에서는 inputs 가 비어 있어 그냥 ''.
          code=$(curl -sS -o /tmp/cron.json -w '%{http_code}' \
            "https://bashy.app/api/cron-notify${{ inputs.force && '?force=1' || '' }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          cat /tmp/cron.json; echo
          # 실패를 초록불로 넘기지 않는다
          [ "$code" = "200" ] || exit 1

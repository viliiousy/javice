name: Send Notifications

# 예약 실행은 껐다. 2026-08-31 부터 cron-job.org 가 10분마다 정확히(지연 10~22초)
# 같은 엔드포인트를 두드린다 — 깃허브는 10분으로 적어 놔도 실제로는 2~5.5시간 주기로 돌았다.
#
# 두 곳이 같이 돌면 중복 알림이 난다. 발송 표식(sent/<slot>)은 보내기를 마친 뒤에 남기므로,
# 두 실행이 겹치는 순간에는 둘 다 '아직 안 보냈다' 로 읽고 각자 보낸다.
# 늦게라도 오는 보험보다, 같은 알림이 두 번 오는 쪽이 실제로 더 성가시다.
#
# 수동 실행은 남겨 둔다 — cron-job.org 가 죽었을 때 여기서 한 번 돌리면 된다.
on:
  workflow_dispatch:  # 수동 실행 가능
    inputs:
      force:
        description: '설정 시각을 무시하고 지금 즉시 발송 (테스트용)'
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger notification cron
        run: |
          # bashy.app 을 직접 호출한다.
          # javice.vercel.app 은 308 리다이렉트라 curl 이 따라가지 않고,
          # -L 을 붙여도 호스트가 바뀌면 Authorization 헤더가 빠진다.
          # 그래서 크론이 아무 일도 안 한 채 초록불로 끝나 버렸다.
          # force=1 은 수동 실행에서만 붙는다. 예약 실행에서는 inputs 가 비어 있어 그냥 ''.
          code=$(curl -sS -o /tmp/cron.json -w '%{http_code}' \
            "https://bashy.app/api/cron-notify${{ inputs.force && '?force=1' || '' }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          cat /tmp/cron.json; echo
          # 실패를 초록불로 넘기지 않는다
          [ "$code" = "200" ] || exit 1
